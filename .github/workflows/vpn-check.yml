name: VPN alive check

# Ничего не коммитит в репозиторий: результат уезжает в secret gist,
# id и токен которого лежат в секретах. Адрес получателя нигде не светится.
permissions:
  contents: read

on:
  # Крон убран 25.08 по решению владельца: запуск теперь только по запросу
  # trigger.py (workflow_dispatch), когда остаток предпроверенных нод падает
  # ниже LOW_WATER. Публикацию в gist это не ломает -- job publish смотрит на
  # inputs.publish, а он по умолчанию true.
  workflow_dispatch:
    inputs:
      batch:
        description: 'нод на один процесс xray'
        default: '300'
      limit:
        description: 'проверить не больше N нод (0 = все)'
        default: '0'
      tg_hours:
        description: 'окно свежести телеграм-слоя, часов'
        default: '48'
      publish:
        description: 'отправлять результат в gist'
        type: boolean
        default: true

concurrency:
  group: vpn-check
  cancel-in-progress: false

jobs:
  collect:
    name: Свежий слой
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Прямое чтение телеграм-каналов через публичное превью t.me/s -- без
      # аккаунтов и ключей -- плюс прямые статические списки (RF-отборки,
      # самопроверяющиеся). Свежий слой собирается за минуты, а не ждёт
      # чужих cron'ов, и едет в checker первым: при нехватке времени
      # страдает старый хвост, а не он. Падение коллектора не роняет
      # конвейер -- шарды просто едут на старых пулах.
      - name: Собрать свежие ноды с каналов
        run: |
          python3 tg_collector.py --pages 2 --hours ${{ inputs.tg_hours || '48' }} --workers 16 \
            || echo "::warning::коллектор не собрал свежий слой, едем на старых пулах"
          test -s out/vless_primary.txt || { echo "::warning::слой пуст"; touch out/vless_primary.txt; }
          wc -l out/vless_primary.txt

      - uses: actions/upload-artifact@v4
        with:
          name: primary
          path: out/vless_primary.txt
          if-no-files-found: error
          retention-days: 1

  check:
    name: shard ${{ matrix.shard }}
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: primary
          path: out

      - name: Поставить xray-core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=""
          for i in 1 2 3 4 5; do
            TAG=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/XTLS/Xray-core/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin).get("tag_name",""))' 2>/dev/null)
            [ -n "$TAG" ] && break
            sleep 10
          done
          [ -n "$TAG" ] || { echo "не получил версию xray-core из GitHub API"; exit 1; }
          echo "xray $TAG"
          curl -sSLo xray.zip "https://github.com/XTLS/Xray-core/releases/download/${TAG}/Xray-linux-64.zip"
          unzip -q -o xray.zip xray
          chmod +x xray
          ./xray version | head -1

      - name: Проверить свою четверть
        run: |
          ulimit -n 65535 || true
          python3 checker.py \
            --shard ${{ matrix.shard }} --shards 4 \
            --out alive-${{ matrix.shard }}.txt \
            --batch ${{ inputs.batch || '300' }} \
            --limit ${{ inputs.limit || '0' }} \
            --tcp-workers 800 \
            --deadline-min 100

      - uses: actions/upload-artifact@v4
        with:
          name: alive-${{ matrix.shard }}
          path: alive-${{ matrix.shard }}.txt
          if-no-files-found: warn
          retention-days: 1

  publish:
    name: Собрать и отправить
    needs: check
    # Замерочный прогон (publish=false) в gist не пишет: иначе частичный
    # список затёр бы полный.
    if: always() && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    steps:
      # pattern обязателен: артефактов в прогоне больше, чем alive-*
      # (collect кладёт primary с ~22k НЕпроверенных ссылок), и без
      # фильтра сырой пул уезжал в gist поверх проверенных нод.
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: alive-*
          merge-multiple: true

      - name: Слить шарды
        run: |
          cat parts/alive-*.txt 2>/dev/null | grep '^# STATS' | sort > head.txt || true
          cat parts/alive-*.txt 2>/dev/null | grep '^vless://' | sort -u > body.txt || true
          cat head.txt body.txt > alive.txt
          echo "нод: $(wc -l < body.txt), отчитались шардов: $(wc -l < head.txt)"
          cat head.txt

      - name: Отправить в gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request

          body = open("alive.txt", encoding="utf-8").read()
          # Считаем только ноды: в файле есть ещё строки "# STATS", и без
          # этого фильтра шапка без единой ноды сошла бы за успешный прогон.
          n = len([l for l in body.splitlines() if l.startswith("vless://")])
          # Пустой результат в gist не пишем. Если прогон развалился, у
          # потребителя должен остаться вчерашний список, а не ноль нод.
          if n == 0:
              print("живых 0 -- gist не трогаю, прошлый список остаётся")
              sys.exit(1)

          req = urllib.request.Request(
              "https://api.github.com/gists/" + os.environ["GIST_ID"],
              data=json.dumps({"files": {"alive.txt": {"content": body}}}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GIST_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "User-Agent": "vpn-alive-check",
                       "Content-Type": "application/json"},
              method="PATCH")
          with urllib.request.urlopen(req, timeout=60) as r:
              print("gist обновлён, HTTP", r.status, "| нод:", n)
          PY
